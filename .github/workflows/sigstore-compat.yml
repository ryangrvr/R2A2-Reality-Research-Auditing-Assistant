# Sigstore compatibility matrix (v0.5.4): test against the lowest and highest
# supported sigstore-python versions. Mocks ONLY the OIDC/network layer;
# SigningContext, Bundle and Verifier are real library classes.
# Stop condition: BOTH matrix jobs green.
name: sigstore-compat
on: [push, pull_request]
jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sigstore-version: ["4.0.0", "4.5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: install package with test dependencies
        run: pip install -e ".[dev]"
      - name: install pinned sigstore
        run: pip install "sigstore==${{ matrix.sigstore-version }}"
      - name: run compatibility tests against real Sigstore classes
        run: python -m pytest tests/test_sigstore_compat.py -v
