# Sigstore compatibility matrix (v0.5.4): real Bundle/Verifier classes.
# Test output is published to the job summary so failures are publicly
# diagnosable without repo-admin log access.
name: sigstore-compat
on: [push, pull_request]
jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sigstore-version: ["4.0.0", "4.5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pip install "sigstore==${{ matrix.sigstore-version }}"
      - name: run compatibility tests
        run: |
          set -o pipefail
          python -m pytest tests/test_sigstore_compat.py -v 2>&1 | tee test-output.txt
      - name: publish output to job summary
        if: always()
        run: |
          {
            echo "### sigstore ${{ matrix.sigstore-version }} compatibility"
            echo '\`\`\`'
            tail -60 test-output.txt || true
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
