# Sigstore compatibility matrix (v0.5.4): real Bundle/Verifier classes.
# Failures are emitted as ::error:: annotations so they are visible in the
# public API without repo-admin log access.
name: sigstore-compat
on: [push, pull_request]
jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sigstore-version: ["4.0.0", "4.5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pip install "sigstore==${{ matrix.sigstore-version }}"
      - name: run compatibility tests
        run: |
          python -m pytest tests/test_sigstore_compat.py -v > out.txt 2>&1 || true
          cat out.txt
          # surface failures as ::error:: annotations (public via API)
          grep -E "^FAILED|^ERROR" out.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E "^FAILED|^ERROR" out.txt > /dev/null && exit 1 || \
            grep -qE "no tests ran" out.txt && exit 1 || exit 0
