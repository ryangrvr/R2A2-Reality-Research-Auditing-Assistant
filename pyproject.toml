[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2a2-science"
version = "0.6.0"
description = "R2A2 - Reality Research Auditing Assistant: general-purpose hypothesis auditing and execution framework. Verifies discipline, not truth."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "R2A2 contributors" }]
dependencies = []
[project.optional-dependencies]
numpy = ["numpy"]
standards = ["jsonschema>=4.18"]
sigstore = ["sigstore>=4,<5"]
jax = ["jax"]
torch = ["torch"]
dev = ["pytest"]

[project.scripts]
r2a2 = "r2a2.cli:main"

[project.entry-points."r2a2.theories"]
# third-party theories register here; core ships none

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
